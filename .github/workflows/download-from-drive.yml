name: Download from Drive & Release

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  download-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create a release and upload assets

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install gdown
        run: pip install gdown

      - name: Download file from Google Drive
        # Using a secret for the File ID is a best practice
        run: gdown "${{ secrets.GOOGLE_DRIVE_FILE_ID }}" -O katib_bundle.zip

      - name: Verify file exists
        run: ls -lh katib_bundle.zip

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          # This will create a release tagged with a timestamp
          tag_name: drive-download-${{ github.run_number }}
          name: "Drive Download Bundle #${{ github.run_number }}"
          files: katib_bundle.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
